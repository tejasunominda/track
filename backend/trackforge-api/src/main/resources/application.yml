spring:
  application:
    name: trackforge-api
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trackforge}
    username: ${DB_USER:trackforge}
    password: ${DB_PASSWORD:trackforge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api/docs/openapi
  swagger-ui:
    path: /api/docs

trackforge:
  jwt:
    issuer: trackforge
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
