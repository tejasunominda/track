# Base Kubernetes manifest for the trackforge-app static SPA, served behind
# the CDN/WAF layer described in Technical Architecture Document §2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackforge-app
  labels:
    app: trackforge-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trackforge-app
  template:
    metadata:
      labels:
        app: trackforge-app
    spec:
      containers:
        - name: trackforge-app
          image: trackforge-app:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: trackforge-app
spec:
  selector:
    app: trackforge-app
  ports:
    - port: 80
      targetPort: 80
